<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>健迹 · 个人健康助手</title>
  <script src="vendor/tailwind.js"></script>
  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'] },
          colors: {
            // 主品牌色：柔和医疗蓝（低饱和度）
            brand: {
              50:  '#f2f7fd',
              100: '#e4eefa',
              200: '#c6ddf3',
              300: '#97c1e8',
              400: '#669fd6',
              500: '#4180bd',
              600: '#2d5791',
              700: '#24446f',
              800: '#1f3a5c',
              900: '#1b3150',
            },
            // 兼容旧 teal 类：统一映射为品牌蓝，保证全局配色一致
            teal: {
              50:  '#f2f7fd',
              100: '#e4eefa',
              200: '#c6ddf3',
              300: '#97c1e8',
              400: '#669fd6',
              500: '#4180bd',
              600: '#2d5791',
              700: '#24446f',
              800: '#1f3a5c',
              900: '#1b3150',
            }
          },
          boxShadow: {
            card: '0 1px 2px rgba(16,24,40,0.04), 0 4px 14px -6px rgba(16,24,40,0.08)',
            'card-hover': '0 2px 4px rgba(16,24,40,0.05), 0 12px 28px -8px rgba(16,24,40,0.12)',
            glow: '0 0 0 3px rgba(45,87,145,0.12)',
          },
        }
      }
    }
  </script>
  <style>
    /* ===== Design Tokens ===== */
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --border: #e7ebf1;
      --border-strong: #d6dde7;
      --text-1: #101828;
      --text-2: #475467;
      --text-3: #98a2b3;
      --brand: #2d5791;
      --brand-700: #24446f;
      --brand-soft: #f2f7fd;
      --danger: #b42318;
      --warn: #b54708;
      --ok: #067647;
      --radius: 14px;
    }

    html { scroll-behavior: smooth; }

    body {
      background:
        radial-gradient(900px 480px at 92% -8%, #eaf2fb 0%, rgba(234,242,251,0) 60%),
        radial-gradient(700px 420px at 0% 0%, #eef4fb 0%, rgba(238,244,251,0) 55%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text-1);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ===== 布局容器 ===== */
    .shell { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
    .page-gap { display: flex; flex-direction: column; gap: 18px; }

    /* ===== 导航 ===== */
    .nav-item {
      position: relative;
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; border-radius: 10px;
      font-size: 13.5px; font-weight: 500; color: #667085;
      transition: color .15s ease, background .15s ease;
    }
    .nav-item:hover { color: #101828; background: #f4f7fb; }
    .nav-item.active { color: var(--brand-700); font-weight: 600; background: var(--brand-soft); }
    .nav-item.active::before {
      content: '';
      position: absolute; left: -6px; top: 50%; transform: translateY(-50%);
      width: 3px; height: 16px; border-radius: 2px; background: var(--brand);
    }
    .nav-item i, .nav-item svg { color: #98a2b3; }
    .nav-item.active i, .nav-item.active svg { color: var(--brand); }
    .nav-label {
      padding: 16px 12px 6px;
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em;
      text-transform: uppercase; color: #98a2b3;
    }

    /* ===== 卡片 ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 1px 2px rgba(16,24,40,0.035), 0 4px 14px -6px rgba(16,24,40,0.07);
      transition: box-shadow .2s ease, border-color .2s ease;
    }
    .card-hoverable:hover {
      box-shadow: 0 2px 4px rgba(16,24,40,0.05), 0 12px 28px -8px rgba(16,24,40,0.12);
      border-color: var(--border-strong);
    }

    /* ===== 字体层级 ===== */
    .page-title {
      font-size: 19px; font-weight: 600; color: #101828; letter-spacing: -0.02em;
      display: flex; align-items: center; gap: 8px;
    }
    .page-sub { font-size: 13px; color: #667085; margin-top: 4px; line-height: 1.6; }
    .card-title {
      font-size: 13.5px; font-weight: 600; color: #1d2939; letter-spacing: -0.01em;
      display: flex; align-items: center; gap: 6px;
    }
    .metric {
      font-size: 26px; font-weight: 600; line-height: 1; color: #101828;
      letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
    }
    .metric-unit { font-size: 11px; font-weight: 400; color: #98a2b3; margin-left: 4px; }
    .metric-label { font-size: 11.5px; font-weight: 500; color: #667085; }
    .eyebrow {
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em;
      text-transform: uppercase; color: #98a2b3;
    }

    /* ===== 按钮 ===== */
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 500; color: #fff;
      background: var(--brand);
      box-shadow: 0 1px 2px rgba(29,58,92,0.24), inset 0 1px 0 rgba(255,255,255,0.12);
      transition: background .15s ease, box-shadow .15s ease, transform .15s ease;
      cursor: pointer; border: 0;
    }
    .btn-primary:hover:not(:disabled) { background: var(--brand-700); box-shadow: 0 4px 12px -2px rgba(29,58,92,0.35); transform: translateY(-1px); }
    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 500; color: #344054;
      background: #fff; border: 1px solid var(--border);
      transition: border-color .15s ease, background .15s ease;
      cursor: pointer;
    }
    .btn-secondary:hover:not(:disabled) { border-color: var(--border-strong); background: #fbfcfe; }

    .btn-ghost {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      padding: 6px 10px; border-radius: 8px;
      font-size: 12.5px; font-weight: 500; color: #475467;
      background: transparent; border: 0; cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .btn-ghost:hover { background: #f2f5fa; color: #101828; }

    .btn-danger {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 500;
      background: #fef3f2; color: var(--danger); border: 1px solid #fecdca;
      transition: background .15s ease; cursor: pointer;
    }
    .btn-danger:hover { background: #fee4e2; }

    /* ===== 表单 ===== */
    .field-label { display: block; font-size: 12px; font-weight: 500; color: #475467; margin-bottom: 6px; }
    .field-input {
      width: 100%; padding: 8px 12px; border-radius: 10px;
      font-size: 13px; color: #1d2939; background: #fbfcfe;
      border: 1px solid var(--border);
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .field-input::placeholder { color: #b4bccb; }
    .field-input:focus { outline: none; background: #fff; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(45,87,145,0.11); }
    .field-input:hover:not(:focus) { border-color: var(--border-strong); }

    /* ===== 徽标 ===== */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 500; line-height: 1.5;
    }
    .badge-teal   { background: #eef4fb; color: #24446f; }
    .badge-amber  { background: #fffaeb; color: #b54708; }
    .badge-slate  { background: #f2f4f7; color: #475467; }
    .badge-rose   { background: #fef3f2; color: #b42318; }
    .badge-indigo { background: #eef4fb; color: #24446f; }
    .badge-emerald{ background: #ecfdf3; color: #067647; }
    .badge-sky    { background: #eef4fb; color: #24446f; }

    /* 分段控件 */
    .seg {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 3px; border-radius: 10px; background: #f2f4f7;
    }
    .seg-btn {
      padding: 5px 12px; border-radius: 8px;
      font-size: 12.5px; font-weight: 500; color: #667085;
      background: transparent; border: 0; cursor: pointer;
      transition: all .15s ease; white-space: nowrap;
    }
    .seg-btn:hover { color: #101828; }
    .seg-btn.active {
      color: #101828; font-weight: 600; background: #fff;
      box-shadow: 0 1px 2px rgba(16,24,40,0.08), 0 0 0 1px rgba(16,24,40,0.04);
    }

    /* 图标统一 */
    [data-lucide] { stroke-width: 1.9; }

    /* 打印 */
    @media print {
      body { background: #fff !important; }
      header, nav, #drawer, .no-print { display: none !important; }
      main, .shell { max-width: 100% !important; padding: 0 !important; }
      .card { break-inside: avoid; border: 1px solid #ddd !important; box-shadow: none !important; }
    }

    /* 草稿高亮 */
    .draft-field { background: #fffaeb; border-color: #fde68a; }
    .draft-field input, .draft-field select { background: #fffaeb; }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d3dae4; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #b6c0cd; }

    /* 动画 */
    .fade-in { animation: fadeIn .28s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* 到期提醒脉冲动画 */
    .pulse-chip {
      animation: pulseChip 1.6s ease-in-out infinite;
    }
    @keyframes pulseChip {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .pulse-ring {
      position: relative;
      animation: pulseRing 1.8s ease-out infinite;
    }
    @keyframes pulseRing {
      0%   { box-shadow: 0 0 0 0 rgba(255, 155, 26, 0.55); }
      70%  { box-shadow: 0 0 0 10px rgba(255, 155, 26, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 155, 26, 0); }
    }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden" style="overflow-x:hidden;">

  <!-- 顶部导航 -->
  <header class="sticky top-0 z-40" style="background: rgba(255,255,255,0.82); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);">
    <div class="shell flex items-center justify-between h-14">
      <a href="#" onclick="JJApp.navigate('overview');return false;" class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-[10px] flex items-center justify-center text-white font-semibold text-[15px]" style="background: linear-gradient(135deg,#3b6ca8,#24446f); box-shadow: 0 2px 6px -1px rgba(36,68,111,0.45);">迹</div>
        <div class="leading-tight">
          <div class="text-[15px] font-semibold text-slate-900 tracking-tight">健迹</div>
          <div class="text-[11px] text-slate-400">个人健康助手</div>
        </div>
      </a>
      <div class="flex items-center gap-1">
        <button onclick="JJApp.navigate('visit')" class="hidden sm:inline-flex btn-secondary text-[12.5px]">
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i>就诊备忘
        </button>
        <button id="btn-menu" class="md:hidden p-2 rounded-lg hover:bg-slate-100 transition-colors" aria-label="菜单">
          <svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="shell py-5 md:py-7 flex flex-col md:flex-row gap-6 md:gap-7">

    <!-- 侧边导航 -->
    <nav id="sidebar" class="hidden md:block md:w-[196px] shrink-0">
      <div class="md:sticky md:top-[76px]">
        <div class="nav-label" style="padding-top:0;">记录</div>
        <a href="#" data-route="overview" class="nav-item active"><i data-lucide="layout-dashboard" class="w-[17px] h-[17px]"></i>概览</a>
        <a href="#" data-route="record" class="nav-item"><i data-lucide="clipboard-list" class="w-[17px] h-[17px]"></i>健康记录</a>
        <a href="#" data-route="trend" class="nav-item"><i data-lucide="trending-up" class="w-[17px] h-[17px]"></i>趋势回顾</a>
        <div class="nav-label">整理</div>
        <a href="#" data-route="visit" class="nav-item"><i data-lucide="stethoscope" class="w-[17px] h-[17px]"></i>就诊准备</a>
        <a href="#" data-route="assistant" class="nav-item"><i data-lucide="bot" class="w-[17px] h-[17px]"></i>AI 助手</a>
        <div class="nav-label">工具</div>
        <a href="#" data-route="medication" class="nav-item"><i data-lucide="pill" class="w-[17px] h-[17px]"></i>服药管理</a>
        <a href="#" data-route="privacy" class="nav-item"><i data-lucide="shield-check" class="w-[17px] h-[17px]"></i>数据与隐私</a>
      </div>
    </nav>

    <!-- 移动端抽屉 -->
    <div id="drawer" class="fixed inset-0 bg-black/40 z-50 hidden md:hidden" onclick="closeDrawer()">
      <div class="absolute left-0 top-0 bottom-0 w-64 bg-white p-4 overflow-y-auto" onclick="event.stopPropagation()" style="box-shadow: 4px 0 24px rgba(16,24,40,0.14);">
        <div class="flex items-center gap-2.5 mb-5 pb-4" style="border-bottom:1px solid var(--border);">
          <div class="w-8 h-8 rounded-[10px] flex items-center justify-center text-white font-semibold" style="background: linear-gradient(135deg,#3b6ca8,#24446f);">迹</div>
          <span class="font-semibold text-slate-900 text-[14px]">健迹 · 导航</span>
        </div>
        <div id="drawer-nav"></div>
      </div>
    </div>

    <!-- 主内容区 -->
    <main class="flex-1 min-w-0">
      <div id="page-container"></div>
    </main>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2.5 rounded-[10px] text-[13px] opacity-0 pointer-events-none transition-all duration-300 z-50" style="box-shadow: 0 8px 24px rgba(16,24,40,0.24);"></div>

  <!-- Scripts (顺序重要) -->
  <script src="js/data.js?v=25"></script>
  <script src="js/ai.js?v=25"></script>
  <script src="js/chart-utils.js?v=25"></script>
  <script src="js/ocr.js?v=25"></script>
  <script src="js/record.js?v=25"></script>
  <script src="js/trend.js?v=25"></script>
  <script src="js/visit.js?v=25"></script>
  <script src="js/overview.js?v=25"></script>
  <script src="js/medication.js?v=25"></script>
  <script src="js/assistant.js?v=25"></script>
  <script src="js/privacy.js?v=25"></script>
  <script src="js/app.js?v=25"></script>
</body>
</html>
